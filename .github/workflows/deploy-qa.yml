name: Deploy SITRA CALCO Frontend - QA

on:
  push:
    branches:
      - qa

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate QA Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular QA
        run: npm run build -- --configuration=qa

  deploy:
    name: Deploy QA

    needs: build

    runs-on: ubuntu-latest

    environment: qa

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy QA
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e

            cd '$DEPLOY_PATH'

            git fetch origin qa
            git checkout qa
            git reset --hard origin/qa

            docker compose -f docker-compose.qa.yml up -d --build --remove-orphans

            docker image prune -f
          "