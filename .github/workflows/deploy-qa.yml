name: Deploy SITRA CALCO Frontend - QA

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sitracalco-frontend-qa
  cancel-in-progress: false

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Angular QA build
        run: npm run build -- --configuration=qa

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: calco-sa-508817
          workload_identity_provider: projects/535758237367/locations/global/workloadIdentityPools/sitracalco-gh/providers/github
          service_account: calco-sa@calco-sa-508817.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure deployment SSH key
        shell: bash
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$VM_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<'CONFIG'
          Host sitracalco-vm
            HostName 127.0.0.1
            User calco-sa
            Port 2222
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CONFIG

          chmod 600 "$HOME/.ssh/config"

      - name: Deploy Angular QA via IAP and SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          gcloud compute start-iap-tunnel calco-operation 22 \
            --project=calco-sa-508817 \
            --zone=us-central1-a \
            --local-host-port=localhost:2222 \
            > "$RUNNER_TEMP/iap.log" 2>&1 < /dev/null &

          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if nc -z 127.0.0.1 2222; then
              break
            fi
            sleep 2
          done

          if ! nc -z 127.0.0.1 2222; then
            cat "$RUNNER_TEMP/iap.log"
            exit 1
          fi

          ssh -T sitracalco-vm \
            'mkdir -p /opt/apps/sitracalco-frontend/qa'

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.angular/' \
            --exclude='.vs/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='gha-creds-*.json' \
            ./ sitracalco-vm:/opt/apps/sitracalco-frontend/qa/

          ssh -T sitracalco-vm 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/apps/sitracalco-frontend/qa

          docker compose \
            -p sitracalco-frontend-qa \
            -f docker-compose.qa.yml \
            config --quiet

          docker compose \
            -p sitracalco-frontend-qa \
            -f docker-compose.qa.yml \
            up -d --build --remove-orphans

          docker compose \
            -p sitracalco-frontend-qa \
            -f docker-compose.qa.yml \
            ps

          docker compose \
            -p sitracalco-frontend-qa \
            -f docker-compose.qa.yml \
            ps --status running --services | grep -qx frontend

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8081/ > /dev/null
          REMOTE