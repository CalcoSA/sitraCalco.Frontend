<div class="d-flex flex-column gap-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2" style="min-height: 40px;">
    <div class="d-flex align-items-center gap-2">
      <mat-icon style="color: #4b2e1f; font-size: 30px; width: 30px; height: 30px;">
        edit
      </mat-icon>
      <h2 class="m-0" style="color: #4b2e1f; font-size: 26px; font-weight: 600;">
        Actualizar bodega
      </h2>
    </div>
    <button mat-stroked-button type="button" (click)="cancel()" style="border-color: #8b6a55; color: #4b2e1f; border-radius: 10px; height: 40px; padding: 0 16px; font-weight: 500;">
      <span class="d-inline-flex align-items-center justify-content-center gap-2" style="height: 40px; line-height: normal;">
        <mat-icon style="display: flex; align-items: center; justify-content: center; font-size: 20px; width: 20px; height: 20px; line-height: 20px; margin: 0;">
          close
        </mat-icon>
        <span class="d-flex align-items-center" style="height: 20px; line-height: 20px;">
          Cancelar
        </span>
      </span>
    </button>
  </div>
</div>
