<div class="min-vh-100 d-flex align-items-center justify-content-center px-3 py-4" style="background-color: #fffdf8;">
  <div class="text-center p-4" style="max-width: 460px; width: 100%;">
    <img src="/images/MonedaCrepes.png" alt="Crepes & Waffles" style="width: 110px; height: 110px; object-fit: contain;" />
    <h2 class="mt-3" style="color: #4b2e1f; font-size: 21px; font-weight: 900;">
      SITRA CALCO S.A
    </h2>
    @if (loading) {
      <div class="spinner-border my-3" role="status" style="color: #4b2e1f;"></div>
      <p style="color: #4b2e1f;">
        Validando acceso desde la intranet...
      </p>
    } @else {
      <p style="color: #4b2e1f;">
        No fue posible completar el acceso.
      </p>
      <a routerLink="/login" style="color: #4b2e1f;">
        Ir al inicio de sesión
      </a>
    }
  </div>
</div>
